# --- Backend Settings ---
# Use GLX (OpenGL) backend for hardware acceleration (Required for reliable VSync on Intel)
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# --- VSync Settings ---
# Enable vertical synchronization to eliminate screen tearing
vsync = true;

# --- Performance & Optimization ---
# Only redraw parts of the screen that have changed (saves battery on your ThinkPad)
use-damage = true;

# Unredirect fullscreen windows to improve performance in games/videos
unredir-if-possible = false;

# --- Window Type Settings (Fixes Qtile bar shadows/artifacts) ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
